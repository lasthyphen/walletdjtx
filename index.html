<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Suspended</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f2;
    }

    .top-banner {
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #d6d6d6;
    }

    .banner-header {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 28px;
      background: #feffff;
    }

    .icon-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }

    /* Person Icon */
    .person-head {
      width: 34px;
      height: 34px;
      background: #bdbdbd;
      border-radius: 50%;
      margin: 0 auto;
    }

    .person-body {
      width: 64px;
      height: 34px;
      background: #bdbdbd;
      border-radius: 34px 34px 10px 10px;
      margin: 4px auto 0;
    }

    /* X Icon */
    .cross {
      position: absolute;
      right: -2px;
      bottom: 4px;
      width: 36px;
      height: 36px;
    }

    .cross::before,
    .cross::after {
      content: "";
      position: absolute;
      top: 15px;
      left: 0;
      width: 36px;
      height: 7px;
      background: #bdbdbd;
      border-radius: 4px;
    }

    .cross::before {
      transform: rotate(45deg);
    }

    .cross::after {
      transform: rotate(-45deg);
    }

    .banner-title {
      font-size: 46px;
      color: #c6c6c6;
      font-weight: 300;
      line-height: 1;
    }

    .message-area {
      background: #1f314a;
      color: white;
      padding: 22px 30px 42px;
    }

    .message-area h2 {
      font-size: 20px;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .message-area p {
      font-size: 16px;
      color: #f1f1f1;
    }

    @media (max-width: 768px) {
      .banner-title {
        font-size: 34px;
      }

      .banner-header {
        padding: 16px;
      }

      .message-area {
        padding: 20px 16px 36px;
      }
    }
  </style>
</head>
<body>

  <div class="top-banner">

    <div class="banner-header">
      <div class="icon-wrapper">
        <img src="banda.png" height="64" alt="bandaa">
      </div>

      <div class="banner-title">
        Account Suspended
      </div>
    </div>

    <div class="message-area">
      <h2>This Account has been suspended.</h2>
      <p>Contact your hosting provider for more information.</p>
    </div>

  </div>

</body>
</html>
